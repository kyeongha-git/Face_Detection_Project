[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests — no I/O, no model loading (fast)
    integration: Integration tests — require actual model weights
    api: API endpoint tests — FastAPI TestClient
    slow: Slow tests — full model load, WiderFace pipeline, etc.

addopts =
    -v
    --strict-markers
    --tb=short

# Async support for FastAPI endpoint tests
asyncio_mode = auto
