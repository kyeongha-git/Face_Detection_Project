name: Pytest CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install CPU version of torch to save time and because non-CUDA tests are used in CI
        python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -r requirements.txt
        python -m pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        # exit-zero treats all errors as warnings (for now) to allow initial CI setup
        # we exclude widerface_evaluate, previous, and data folders
        python -m flake8 .

    - name: Check formatting with black
      run: |
        python -m black --check . --exclude "widerface_evaluate|previous|data"

    - name: Run tests with pytest
      run: |
        python -m pytest tests/ -v --tb=short
